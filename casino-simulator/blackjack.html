<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack - Casino Simulator</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/blackjack.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>♠️ Blackjack</h1>
                <p class="subtitle">Juego en tiempo real</p>
            </div>
            <div class="header-stats">
                <div class="stat-box">
                    <span class="label">Balance del Casino</span>
                    <span class="value" id="casinoBalance">$1.000.000</span>
                </div>
                <div class="stat-box">
                    <span class="label">Mesas Activas</span>
                    <span class="value" id="activeTables">0</span>
                </div>
            </div>
        </header>

        <!-- Controles -->
        <section class="controls">
            <button id="createTableBtn" class="btn btn-primary">+ Nueva Mesa</button>
            <button id="startGameBtn" class="btn btn-secondary" disabled>▶ Iniciar Juego</button>
            <button id="resetBtn" class="btn btn-danger">↻ Reset</button>

            <div class="control-group">
                <label for="numPlayersSelect">Jugadores:</label>
                <select id="numPlayersSelect" class="select">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="4" selected>4</option>
                    <option value="6">6</option>
                </select>
            </div>

            <div class="control-group">
                <label for="speedSelect">Velocidad:</label>
                <select id="speedSelect" class="select">
                    <option value="1">1x</option>
                    <option value="2">2x</option>
                    <option value="4">4x</option>
                </select>
            </div>
        </section>

        <!-- Mesas de Blackjack -->
        <section class="canvas-area">
            <div id="tablesContainer" class="tables-container">
                <!-- Las mesas se crean aquí -->
            </div>
        </section>

        <!-- Estadísticas -->
        <section class="dashboard">
            <div class="dashboard-section">
                <h3>📊 Estadísticas de la Mesa</h3>
                <div class="stats-grid">
                    <div class="stat">
                        <span class="stat-name">Manos Jugadas</span>
                        <span class="stat-value" id="handsPlayed">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-name">Dinero en Juego</span>
                        <span class="stat-value" id="moneyInPlay">$0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-name">Ingresos (Casino)</span>
                        <span class="stat-value" id="houseEarnings">$0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-name">House Edge</span>
                        <span class="stat-value" id="houseEdge">0%</span>
                    </div>
                </div>
            </div>

            <div class="dashboard-section">
                <h3>🎯 Jugador Mejor Desempeño</h3>
                <div id="topPlayer" class="clients-list">
                    <p class="placeholder">Sin datos</p>
                </div>
            </div>

            <div class="dashboard-section">
                <h3>📈 Últimos Eventos</h3>
                <div id="eventLog" class="event-log">
                    <p class="placeholder">Esperando eventos...</p>
                </div>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="js/lib/random.js"></script>
    <script src="js/lib/storage.js"></script>
    <script src="js/lib/currency.js"></script>
    <script src="js/simulation/client.js"></script>
    <script src="js/simulation/casino.js"></script>
    <script src="js/simulation/games/blackjack.js"></script>
    <script src="js/render/cards-renderer.js"></script>
    <script src="js/render/table-renderer.js"></script>
    <script src="js/blackjack-app.js"></script>
</body>
</html>
