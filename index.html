<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Prompts Profesionales</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Generador de Prompts</h1>
            <p class="subtitle">Transforma tus ideas en prompts profesionales</p>
        </header>

        <main>
            <!-- Configuración de API -->
            <section class="api-config">
                <h2>Configuración</h2>
                <div class="config-group">
                    <label for="apiKey">API Key de Google Gemini (gratuita):</label>
                    <input
                        type="password"
                        id="apiKey"
                        placeholder="Obtén tu clave en https://aistudio.google.com/apikey"
                        class="input-field"
                    >
                    <a href="https://aistudio.google.com/apikey" target="_blank" class="help-link">Obtener API Key gratis →</a>
                </div>
            </section>

            <!-- Entrada de idea -->
            <section class="input-section">
                <h2>Tu Idea</h2>
                <textarea
                    id="ideaInput"
                    placeholder="Describe brevemente tu idea o concepto para el prompt..."
                    class="textarea-field"
                    rows="4"
                ></textarea>

                <div class="input-controls">
                    <div class="tone-selector">
                        <label for="tone">Tono del prompt:</label>
                        <select id="tone" class="select-field">
                            <option value="profesional">Profesional</option>
                            <option value="casual">Casual</option>
                            <option value="técnico">Técnico</option>
                            <option value="creativo">Creativo</option>
                            <option value="académico">Académico</option>
                        </select>
                    </div>

                    <button id="generateBtn" class="btn btn-primary">
                        Generar Prompt
                    </button>
                </div>
            </section>

            <!-- Prompt generado -->
            <section class="output-section" id="outputSection" style="display: none;">
                <h2>Prompt Generado</h2>
                <div class="prompt-display">
                    <div id="promptOutput" class="prompt-text"></div>

                    <div class="prompt-actions">
                        <button id="copyBtn" class="btn btn-secondary">📋 Copiar</button>
                        <button id="exportBtn" class="btn btn-secondary">⬇️ Exportar</button>
                        <button id="saveBtn" class="btn btn-secondary">💾 Guardar</button>
                    </div>
                </div>
            </section>

            <!-- Historial de prompts guardados -->
            <section class="history-section" id="historySection" style="display: none;">
                <h2>Prompts Guardados</h2>
                <div id="historyList" class="history-list"></div>
                <button id="clearHistoryBtn" class="btn btn-danger">🗑️ Limpiar Historial</button>
            </section>
        </main>

        <footer>
            <p>Powered by Google Generative AI</p>
        </footer>
    </div>

    <!-- Loading spinner -->
    <div id="loadingSpinner" class="loading-spinner" style="display: none;">
        <div class="spinner"></div>
        <p>Generando prompt profesional...</p>
    </div>

    <!-- Toast notifications -->
    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
</body>
</html>
